[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyaxvideo"
version = "0.1.1"
description = "Python bindings for ax-video-sdk: hardware video decode/encode/JPEG/image-processing on AXERA chips (AXCL & AX650)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/AXERA-TECH/ax-video-sdk"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pyaxvideo"]

[tool.setuptools.package-data]
pyaxvideo = ["_native/*.so"]
